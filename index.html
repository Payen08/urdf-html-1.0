<script type="module">
// 使用importmap解决模块依赖问题
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
import { ColladaLoader } from 'three/addons/loaders/ColladaLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import JSZip from 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm';

// 将THREE对象添加到全局作用域，以便现有代码可以访问
window.THREE = THREE;
window.GLTFLoader = GLTFLoader;
window.DRACOLoader = DRACOLoader;
window.OrbitControls = OrbitControls;
(function(){
window.addEventListener('load',()=>{
  // 确保 THREE 对象已加载
  if (typeof THREE === 'undefined') {
    console.error('THREE.js 未正确加载');
    document.getElementById('status').textContent = '状态：THREE.js 加载失败';
    return;
  }
  const statusEl=document.getElementById('status');
function showToast(message,type='info',duration=3200){
  const container=document.getElementById('toastContainer');
  if(!container) return;
  const toast=document.createElement('div');
  toast.className=`app-toast ${type}`;
  toast.setAttribute('role',type==='error'?'alert':'status');
  const icon=document.createElement('i');
  icon.className=type==='error'
    ?'fa-solid fa-circle-exclamation'
    :type==='success'
      ?'fa-solid fa-circle-check'
      :'fa-solid fa-circle-info';
  const text=document.createElement('span');
  text.textContent=message;
  toast.append(icon,text);
  container.appendChild(toast);
  setTimeout(()=>toast.remove(),duration);
}
function axisFromDirection(value){
  const match=/^([xyz]):(-?1)$/.exec(String(value||''));
  const axis={x:0,y:0,z:0};
  if(match) axis[match[1]]=Number(match[2]);
  return axis;
}
function directionFromAxis(axis={}){
  const entries=['x','y','z'].map(key=>[key,Number(axis[key])||0]);
  entries.sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
  const [key,value]=entries[0];
  return value?`${key}:${value>0?1:-1}`:'';
}
function updateBlenderOffsetHint(){
  const hint=document.getElementById('editorBlenderOffsetHint');
  if(!hint) return;
  const gltfAxis=axisFromDirection(document.getElementById('axisDirection').value);
  const offset=Number(document.getElementById('editorPositionOffset').value)||0;
  if(Math.abs(offset)<1e-9){
    hint.textContent='无需添加';
    return;
  }
  // 标准 glTF 导出坐标换算：Blender (X,Y,Z) → glTF (X,Z,-Y)。
  const blenderAxis={x:gltfAxis.x,y:-gltfAxis.z,z:gltfAxis.y};
  const components=[
    ['X',blenderAxis.x],
    ['Y',blenderAxis.y],
    ['Z',blenderAxis.z]
  ].filter(([,value])=>Math.abs(value)>1e-9);
  const formatDegrees=value=>{
    const rounded=Number(value.toFixed(3));
    return `${rounded>0?'+':''}${rounded}°`;
  };
  if(components.length===1 && Math.abs(Math.abs(components[0][1])-1)<1e-9){
    const [axis,sign]=components[0];
    hint.textContent=`本地 ${axis}：${formatDegrees(offset*sign)}`;
    return;
  }
  if(!components.length){
    hint.textContent='请先设置 Axis';
    return;
  }
  hint.textContent=`本地轴 (${blenderAxis.x}, ${blenderAxis.y}, ${blenderAxis.z})：${formatDegrees(offset)}`;
}
function toggleJointEditor(show, name){
  const editor=document.getElementById('jointEditor');
  if(!show) return;
  editor.classList.add('active');
  document.getElementById('editorName').value=name;
  const j=jointMap[name];
  if(j){
    document.getElementById('editorParent').value=j.parentLinkName||j.parent||'';
    document.getElementById('editorChild').value=j.childLinkName||j.child||'';
    document.getElementById('editorReportedName').value=j.reportedJointName||name;
    document.getElementById('editorPositionScale').value=j.positionScale;
    document.getElementById('editorPositionOffset').value=j.positionOffsetDeg;
    document.getElementById('editorDetectedBindAngle').textContent=`${Number(getAxisTwistDegrees(j).toFixed(3))}°`;
    document.getElementById('axisDirection').value=directionFromAxis(j.axis);
    updateBlenderOffsetHint();
  }
}

//高亮滚动
function focusJointInJson(name){
  const ta=document.getElementById('jsonInput');
  if(!ta) return;
  const text=ta.value;
  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const re=new RegExp(`"name"\\s*:\\s*"${esc(name)}"`);
  const idx=text.search(re);
  if(idx===-1) return;

  // 定位包含 name 的整行，但不抢占编辑器焦点或选中文本。
  // 否则用户继续调整右侧关节时，键盘输入会误写入 JSON。
  let start=text.lastIndexOf('\n', idx);
  start = start === -1 ? 0 : start + 1;

  // 平滑滚动到可见位置
  const before=text.slice(0,start);
  const totalLines=text.split('\n').length;
  const lineNum=(before.match(/\n/g)||[]).length;
  const ratio=Math.min(1, Math.max(0, (lineNum-3)/(totalLines||1)));
  ta.scrollTop = ratio * (ta.scrollHeight - ta.clientHeight);
}

function releaseJsonEditorFocus(){
  const ta=document.getElementById('jsonInput');
  if(!ta) return;
  if(document.activeElement===ta) ta.blur();
  if(ta.selectionStart!==ta.selectionEnd){
    const caret=ta.selectionEnd;
    try { ta.setSelectionRange(caret,caret); } catch(e){}
  }
}


function populateJointNames(){
  const jointNames=[];
  if(currentModel){
    currentModel.traverse(n=>{ if(n.isBone||n.type==="Bone") jointNames.push(n.name); });
  }
  return jointNames;
}

function saveJointEdits(){
  try{
    const name=document.getElementById('editorName').value.trim();
    if(!name) throw new Error('请先选择一个模型关节');
    if(!jointMap[name]) throw new Error(`当前模型中找不到关节 ${name}，请重新选择关节`);
    const axis=axisFromDirection(document.getElementById('axisDirection').value);
    if(axis.x===0&&axis.y===0&&axis.z===0){
      throw new Error('请选择一个 Axis 方向');
    }
    const positionScale=parseFloat(document.getElementById('editorPositionScale').value);
    const positionOffsetDeg=parseFloat(document.getElementById('editorPositionOffset').value);
    if(!Number.isFinite(positionScale)) throw new Error('位置方向倍率必须是有效数字');
    if(!Number.isFinite(positionOffsetDeg)) throw new Error('零位偏移必须是有效数字');

    const previousPositionScale=Number(jointMap[name].positionScale);
    const previousPositionOffset=Number(jointMap[name].positionOffsetDeg);
    jointMap[name].axis=axis;
    jointMap[name].parentLinkName=document.getElementById('editorParent').value;
    jointMap[name].childLinkName=document.getElementById('editorChild').value;
    jointMap[name].reportedJointName=document.getElementById('editorReportedName').value.trim()||name;
    jointMap[name].positionScale=positionScale;
    jointMap[name].positionOffsetDeg=positionOffsetDeg;
    const serializeJoint=(name,base={})=>({
      ...base,
      name,
      modelNodeName:jointMap[name].modelNodeName!==name?jointMap[name].modelNodeName:undefined,
      reportedJointName:jointMap[name].reportedJointName,
      positionScale:jointMap[name].positionScale,
      positionOffsetDeg:jointMap[name].positionOffsetDeg,
      rotationReference:jointMap[name].rotationReference,
      rotationSpace:jointMap[name].rotationSpace,
      axis:jointMap[name].axis,
      parentLinkName:jointMap[name].parentLinkName||jointMap[name].parent||'',
      childLinkName:jointMap[name].childLinkName||jointMap[name].child||''
    });
    const existingJoints=Array.isArray(urdfData&&urdfData.joints)?urdfData.joints:[];
    const joints=existingJoints.map(joint=>jointMap[joint.name]?serializeJoint(joint.name,joint):joint);
    const existingNames=new Set(existingJoints.map(joint=>joint.name));
    for(const k in jointMap){
      if(!existingNames.has(k)) joints.push(serializeJoint(k));
      if(jointMap[k].axisHelper){
        jointMap[k].node.remove(jointMap[k].axisHelper);
        jointMap[k].axisHelper=null;
      }
    }
    urdfData={...(urdfData||{}),joints};
    jsonInput.value=JSON.stringify({urdf:urdfData},null,2);
    const controlLabel=jointMap[name].controlDiv&&jointMap[name].controlDiv.firstElementChild;
    if(controlLabel){
      controlLabel.textContent=name;
      controlLabel.removeAttribute('title');
    }
    if(latestReportedJointStates.length){
      renderJointMappingResult(applyLatestJointStates(latestReportedJointStates));
    }
    let appliedNow=false;
    const editedJoint=jointMap[name];
    if(editedJoint.hasAppliedValue){
      // 有原始上报角时直接按新倍率/偏移重算；手动值则先按旧配置还原再重新映射。
      const baseDegrees=Number.isFinite(editedJoint.lastReportedDegrees)
        ?editedJoint.lastReportedDegrees
        :Number.isFinite(previousPositionScale)&&Math.abs(previousPositionScale)>1e-12
          ?(editedJoint.value-(Number.isFinite(previousPositionOffset)?previousPositionOffset:0))/previousPositionScale
          :editedJoint.value;
      const mappedDegrees=baseDegrees*positionScale+positionOffsetDeg;
      editedJoint.value=mappedDegrees;
      editedJoint.appliedDegrees=mappedDegrees;
      editedJoint.renderedValue=mappedDegrees;
      editedJoint.targetValue=mappedDegrees;
      editedJoint.smoothReportedValue=false;
      applyJointRotation(name,mappedDegrees);
      if(editedJoint.syncControlUnit) editedJoint.syncControlUnit();
      appliedNow=true;
    }
    renderJointDiagnostics();
    setStatus('关节编辑已保存并写入JSON');
    toggleJointEditor(true,name);
    showToast(
      appliedNow
        ?`${name} 已保存并应用，最终角度 ${Number(editedJoint.value.toFixed(3))}°`
        :`${name} 已保存；零位偏移会在应用关节角后生效`,
      'success'
    );
  }catch(error){
    console.error('保存关节失败',error);
    setStatus('关节编辑保存失败');
    showToast(`保存失败：${error.message}`,'error',4500);
  }
}

  function disposeObject3D(root){
    root.traverse(object=>{
      if(object.geometry) object.geometry.dispose();
      const materials=Array.isArray(object.material)?object.material:[object.material];
      for(const material of materials){
        if(!material) continue;
        for(const value of Object.values(material)){

        }
        material.dispose();
      }
    });

  function updateHelpers(){

    const size=box.getSize(new THREE.Vector3());
    const maxDim=Math.max(size.x,size.y,size.z,1);
    const gridSize=mapPlane&&currentMap ? Math.max(size.x,size.y,1) : maxDim*2;
    const gridDivisions=mapPlane&&currentMap ? Math.min(120,Math.max(10,Math.round(gridSize))) : Math.max(2,Math.floor(maxDim/2));
    const gridCenter=box.getCenter(new THREE.Vector3());
    gridHelper=new THREE.GridHelper(gridSize,gridDivisions,0x8a8a8a,0x575757);
    gridHelper.rotation.x=Math.PI/2; // Rotate to XY plane (Z-up)
    gridHelper.position.set(gridCenter.x,gridCenter.y,mapPlane&&currentMap ? mapPlane.position.z+0.01 : 0);

  function fitCameraToScene(){

  function getMapSize(map){
    if(map.displaySize){
      const scale=Number(map.scale)||1;
      return { width:map.displaySize.width*scale, height:map.displaySize.height*scale };
    }
    const metadata=map.metadata||{};
    const width=Number(metadata.width);
    const height=Number(metadata.height);
    const resolution=Number(metadata.resolution);
    if(width>0 && height>0 && resolution>0){
      return { width:width*resolution, height:height*resolution };
    }
    const imageWidth=map.imageWidth||1;
    const imageHeight=map.imageHeight||1;
    const aspect=imageWidth/imageHeight;
    const span=getMapAnchor().span;
    return aspect>=1 ? { width:span, height:span/aspect } : { width:span*aspect, height:span };
  }

  function installMapTexture(texture, options){

  async function installMapBlob(blob, options){
    const image=await createImageBitmap(blob);
    const canvas=document.createElement('canvas');
    canvas.width=image.width;
    canvas.height=image.height;
    const context=canvas.getContext('2d');
    context.drawImage(image,0,0);
    const texture=new THREE.CanvasTexture(canvas);
    texture.minFilter=THREE.LinearFilter;
    texture.magFilter=THREE.LinearFilter;
    texture.generateMipmaps=false;
    texture.needsUpdate=true;
    installMapTexture(texture,options);
    setStatus('地图已加载');
  }

  function getEmbeddedMap(json){
    const entities=Array.isArray(json.mapfileEntitys)?json.mapfileEntitys:[];
    const entity=entities.find(item=>item&&item.content&&Array.isArray(item.content.data));
    if(!entity) throw new Error('JSON 中未找到内嵌地图图片');
    const record=entity.record||{};
    return {
      bytes:new Uint8Array(entity.content.data),
      name:record.alias||record.name||'JSON 地图',
      metadata:{
        width:Number(record.width)||0,
        height:Number(record.height)||0,
        resolution:Number(record.resolution)||0,
        yaw:Number(record.origin&&record.origin.yaw)||0
      }
    };
  }

  async function loadMapFile(file){
    const lowerName=file.name.toLowerCase();
    if(file.type==='image/png' || lowerName.endsWith('.png')){
      await installMapBlob(file,{ name:file.name, metadata:null });
      return;
    }
    if(file.type==='application/json' || lowerName.endsWith('.json')){
      const json=JSON.parse(await file.text());
      const embeddedMap=getEmbeddedMap(json);
      const blob=new Blob([embeddedMap.bytes],{type:'image/png'});
      await installMapBlob(blob,{ name:embeddedMap.name, metadata:embeddedMap.metadata });
      return;
    }
    throw new Error('仅支持 JSON 或 PNG 地图文件');
  }

  function normalizePackagePath(path){
    let value=decodeURIComponent(String(path||'').replace(/\\/g,'/').split(/[?#]/)[0]);
    value=value.replace(/^file:\/+/i,'').replace(/^\/+/,'');
    if(value.startsWith('package://')){
      value=value.slice('package://'.length).split('/').slice(1).join('/');
    }
    const parts=[];
    for(const part of value.split('/')){
      if(!part||part==='.') continue;
      if(part==='..') parts.pop();
      else parts.push(part);
    }
    return parts.join('/');
  }

  function packageDirectory(path){
    const normalized=normalizePackagePath(path);
    const slash=normalized.lastIndexOf('/');
    return slash===-1?'':normalized.slice(0,slash+1);
  }

  function makePackageRecord(path,blob){
    return {
      path:normalizePackagePath(path),
      blob,
      text:()=>blob.text(),
      arrayBuffer:()=>blob.arrayBuffer()
    };
  }

  function recordsFromFiles(files){
    return Array.from(files).map(file=>makePackageRecord(file.webkitRelativePath||file.name,file));
  }

  async function recordsFromZip(file){
    const zip=await JSZip.loadAsync(file);
    const records=[];
    for(const entry of Object.values(zip.files)){
      if(entry.dir || entry.name.startsWith('__MACOSX/')) continue;
      records.push(makePackageRecord(entry.name,await entry.async('blob')));
    }
    return records;
  }

  function findPackageAsset(records,reference,basePath=''){
    if(!reference) return null;
    let requested=String(reference).replace(/^package:\/\/[^/]+\//i,'');
    if(requested.startsWith('urdfpkg:///')) requested=requested.slice('urdfpkg:///'.length);
    const direct=normalizePackagePath(requested);
    const relative=normalizePackagePath(packageDirectory(basePath)+requested);
    const candidates=[relative,direct].filter(Boolean);
    for(const candidate of candidates){
      const exact=records.find(record=>record.path===candidate);
      if(exact) return exact;
    }
    const suffix='/'+direct;
    return records
      .filter(record=>record.path===direct||record.path.endsWith(suffix))
      .sort((a,b)=>a.path.split('/').length-b.path.split('/').length)[0]||null;
  }

  async function findMainUrdf(records){
    const candidates=records.filter(record=>/\.(urdf|xml)$/i.test(record.path));
    if(!candidates.length) throw new Error('文件包中未找到 URDF 文件');
    let best=null;
    for(const record of candidates){
      try{
        const xmlText=await record.text();
        const xml=new DOMParser().parseFromString(xmlText,'application/xml');
        const robot=xml.documentElement&&xml.documentElement.localName==='robot'?xml.documentElement:null;
        if(!robot || xml.querySelector('parsererror')) continue;
        const score=robot.querySelectorAll('link').length*2+
          robot.querySelectorAll('joint').length*3-
          record.path.split('/').length;
        if(!best||score>best.score) best={record,xmlText,xml,robot,score};
      }catch(error){}
    }
    if(!best) throw new Error('未找到可解析的主 URDF 文件');
    return best;
  }

  function directChild(element,name){
    return Array.from(element&&element.children||[]).find(child=>child.localName===name)||null;
  }

  function directChildren(element,name){
    return Array.from(element&&element.children||[]).filter(child=>child.localName===name);
  }

  function parseNumbers(value,count,fallback=0){
    const values=String(value||'').trim().split(/\s+/).filter(Boolean).map(Number);
    return Array.from({length:count},(_,index)=>Number.isFinite(values[index])?values[index]:fallback);
  }

  function parseOrigin(element){
    const origin=directChild(element,'origin');
    const [x,y,z]=parseNumbers(origin&&origin.getAttribute('xyz'),3,0);
    const [roll,pitch,yaw]=parseNumbers(origin&&origin.getAttribute('rpy'),3,0);
    return {x,y,z,roll,pitch,yaw};
  }

  function applyUrdfOrigin(object,origin){
    object.position.set(origin.x,origin.y,origin.z);
    // URDF rpy 使用固定轴旋转：Rz(yaw) × Ry(pitch) × Rx(roll)。
    const rollQ=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0),origin.roll);
    const pitchQ=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),origin.pitch);
    const yawQ=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1),origin.yaw);
    object.quaternion.copy(yawQ).multiply(pitchQ).multiply(rollQ);
  }

  function parseUrdfMaterial(element,globalMaterials){
    const materialElement=directChild(element,'material');
    if(!materialElement) return null;
    const name=materialElement.getAttribute('name')||'';
    const colorElement=directChild(materialElement,'color');
    const textureElement=directChild(materialElement,'texture');
    if(!colorElement&&!textureElement&&name&&globalMaterials.has(name)) return globalMaterials.get(name);
    const rgba=parseNumbers(colorElement&&colorElement.getAttribute('rgba'),4,1);
    return {
      name,
      color:rgba.slice(0,3),
      opacity:rgba[3],
      texture:textureElement&&textureElement.getAttribute('filename')||''
    };
  }

  function createPackageLoadingManager(records,urlCache,basePath,packageUrls){
    const manager=new THREE.LoadingManager();
    manager.setURLModifier(url=>{
      if(/^(data:|blob:|https?:)/i.test(url)) return url;
      const asset=findPackageAsset(records,url,basePath);
      if(!asset) return url;
      if(!urlCache.has(asset.path)){
        const objectUrl=URL.createObjectURL(asset.blob);
        urlCache.set(asset.path,objectUrl);
        packageUrls.push(objectUrl);
      }
      return urlCache.get(asset.path);
    });
    return manager;
  }

  async function createUrdfMaterial(definition,records,manager,basePath,collision=false){
    if(collision){
      return new THREE.MeshStandardMaterial({color:0xffa64d,transparent:true,opacity:.22,roughness:.8});
    }
    const color=definition&&definition.color||[.72,.72,.75];
    const material=new THREE.MeshStandardMaterial({
      color:new THREE.Color(color[0],color[1],color[2]),
      transparent:Boolean(definition&&definition.opacity<1),
      opacity:definition&&Number.isFinite(definition.opacity)?definition.opacity:1,
      roughness:.72,
      metalness:.05
    });
    material.userData.urdfExplicit=Boolean(definition);
    if(definition&&definition.texture){
      const textureAsset=findPackageAsset(records,definition.texture,basePath);
      if(textureAsset){
        const texture=await new THREE.TextureLoader(manager).loadAsync(`urdfpkg:///${textureAsset.path}`);
        texture.colorSpace=THREE.SRGBColorSpace;
        material.map=texture;
        material.needsUpdate=true;
      }
    }
    return material;
  }

  async function loadUrdfMesh(meshElement,records,manager,urlCache,urdfPath,material,collision){
    const filename=meshElement.getAttribute('filename')||meshElement.getAttribute('url')||'';
    const asset=findPackageAsset(records,filename,urdfPath);
    if(!asset) throw new Error(`缺少 Mesh：${filename}`);
    const extension=asset.path.split('.').pop().toLowerCase();
    let object;
    if(extension==='stl'){
      const geometry=new STLLoader(manager).parse(await asset.arrayBuffer());
      geometry.computeVertexNormals();
      object=new THREE.Mesh(geometry,material);
    }else if(extension==='obj'){
      const objText=await asset.text();
      const objLoader=new OBJLoader(manager);
      const mtlMatch=objText.match(/^\s*mtllib\s+(.+)$/im);
      if(mtlMatch){
        const mtlAsset=findPackageAsset(records,mtlMatch[1].trim(),asset.path);
        if(mtlAsset){
          const materials=new MTLLoader(manager).parse(await mtlAsset.text(),`urdfpkg:///${packageDirectory(mtlAsset.path)}`);
          materials.preload();
          objLoader.setMaterials(materials);
        }
      }
      object=objLoader.parse(objText);
    }else if(extension==='dae'){
      object=new ColladaLoader(manager).parse(await asset.text(),`urdfpkg:///${packageDirectory(asset.path)}`).scene;
    }else if(extension==='glb'||extension==='gltf'){
      const gltfLoader=new GLTFLoader(manager);
      gltfLoader.setDRACOLoader(dracoLoader);
      const data=extension==='glb'?await asset.arrayBuffer():await asset.text();
      const gltf=await new Promise((resolve,reject)=>{
        gltfLoader.parse(data,`urdfpkg:///${packageDirectory(asset.path)}`,resolve,reject);
      });
      object=gltf.scene;
    }else{
      throw new Error(`暂不支持 Mesh 格式：.${extension}`);
    }
    if(collision){
      object.traverse(child=>{
        if(child.isMesh) child.material=material.clone();
      });
    }else if(material.userData.urdfExplicit){
      object.traverse(child=>{
        if(child.isMesh) child.material=material.clone();
      });
    }else if(extension!=='obj'&&extension!=='dae'&&extension!=='glb'&&extension!=='gltf'){
      object.traverse(child=>{ if(child.isMesh) child.material=material; });
    }
    const [sx,sy,sz]=parseNumbers(meshElement.getAttribute('scale'),3,1);
    object.scale.multiply(new THREE.Vector3(sx,sy,sz));
    object.name=asset.path.split('/').pop();
    return object;
  }

  async function createUrdfGeometry(geometryElement,records,manager,urlCache,urdfPath,material,collision){
    const geometryNode=geometryElement&&geometryElement.firstElementChild;
    if(!geometryNode) return null;
    if(geometryNode.localName==='mesh'){
      return loadUrdfMesh(geometryNode,records,manager,urlCache,urdfPath,material,collision);
    }
    let geometry=null;
    if(geometryNode.localName==='box'){
      const [x,y,z]=parseNumbers(geometryNode.getAttribute('size'),3,1);
      geometry=new THREE.BoxGeometry(x,y,z);
    }else if(geometryNode.localName==='cylinder'){
      const radius=Number(geometryNode.getAttribute('radius'))||.5;
      const length=Number(geometryNode.getAttribute('length'))||1;
      geometry=new THREE.CylinderGeometry(radius,radius,length,32);
      geometry.rotateX(Math.PI/2);
    }else if(geometryNode.localName==='sphere'){
      geometry=new THREE.SphereGeometry(Number(geometryNode.getAttribute('radius'))||.5,32,20);
    }
    return geometry?new THREE.Mesh(geometry,material):null;
  }

  function describeUrdfGeometry(geometryElement){
    const node=geometryElement&&geometryElement.firstElementChild;
    if(!node) return null;
    if(node.localName==='mesh'){
      return {
        type:'mesh',
        filename:node.getAttribute('filename')||node.getAttribute('url')||'',
        scale:parseNumbers(node.getAttribute('scale'),3,1)
      };
    }
    if(node.localName==='box') return {type:'box',size:parseNumbers(node.getAttribute('size'),3,1)};
    if(node.localName==='cylinder'){
      return {type:'cylinder',radius:Number(node.getAttribute('radius'))||0,length:Number(node.getAttribute('length'))||0};
    }
    if(node.localName==='sphere') return {type:'sphere',radius:Number(node.getAttribute('radius'))||0};
    return {type:node.localName};
  }

  function parseInertial(linkElement){
    const inertial=directChild(linkElement,'inertial');
    if(!inertial) return null;
    const mass=directChild(inertial,'mass');
    const tensor=directChild(inertial,'inertia');
    return {
      origin:parseOrigin(inertial),
      mass:Number(mass&&mass.getAttribute('value'))||0,
      inertia:tensor?Object.fromEntries(['ixx','ixy','ixz','iyy','iyz','izz'].map(key=>[key,Number(tensor.getAttribute(key))||0])):null
    };
  }

  function parseElementAttributes(element){
    if(!element) return null;
    const result={};
    for(const attribute of Array.from(element.attributes)){
      const numeric=Number(attribute.value);
      result[attribute.name]=attribute.value.trim()!==''&&Number.isFinite(numeric)?numeric:attribute.value;
    }
    return result;
  }

  async function loadUrdfPackage(records,packageLabel){
    setStatus('正在解析 URDF 文件包…');
    const main=await findMainUrdf(records);
    const globalMaterials=new Map();
    for(const materialElement of directChildren(main.robot,'material')){
      const name=materialElement.getAttribute('name')||'';
      if(name) globalMaterials.set(name,parseUrdfMaterial({children:[materialElement]},new Map()));
    }
    const urlCache=new Map();
    const packageUrls=[];
    const manager=createPackageLoadingManager(records,urlCache,main.record.path,packageUrls);
    const robotRoot=new THREE.Group();
    robotRoot.name=main.robot.getAttribute('name')||'URDFRobot';
    robotRoot.userData.urdfSource=main.record.path;
    const linkObjects=new Map();
    const linkData=[];
    const warnings=[];
    for(const linkElement of directChildren(main.robot,'link')){
      const linkName=linkElement.getAttribute('name')||`link_${linkObjects.size+1}`;
      const linkObject=new THREE.Group();
      linkObject.name=linkName;
      linkObject.userData.urdfLink=true;
      linkObject.userData.inertial=parseInertial(linkElement);
      const visualGroup=new THREE.Group();
      visualGroup.name=`${linkName}_visual`;
      linkObject.add(visualGroup);
      const collisionGroup=new THREE.Group();
      collisionGroup.name=`${linkName}_collision`;
      collisionGroup.visible=false;
      linkObject.add(collisionGroup);
      const visualData=[];
      const collisionData=[];
      for(const [kind,target,dataTarget] of [['visual',visualGroup,visualData],['collision',collisionGroup,collisionData]]){
        for(const element of directChildren(linkElement,kind)){
          const origin=parseOrigin(element);
          const geometryElement=directChild(element,'geometry');
          const materialDefinition=parseUrdfMaterial(element,globalMaterials);
          const material=await createUrdfMaterial(materialDefinition,records,manager,main.record.path,kind==='collision');
          try{
            const geometryObject=await createUrdfGeometry(geometryElement,records,manager,urlCache,main.record.path,material,kind==='collision');
            if(!geometryObject) continue;
            const frame=new THREE.Group();
            frame.name=element.getAttribute('name')||`${linkName}_${kind}_${dataTarget.length+1}`;
            applyUrdfOrigin(frame,origin);
            frame.add(geometryObject);
            target.add(frame);
            dataTarget.push({
              name:frame.name,
              origin,
              geometry:describeUrdfGeometry(geometryElement),
              material:materialDefinition
            });
          }catch(error){
            warnings.push(`${linkName}/${kind}: ${error.message}`);
          }
        }
      }
      linkObjects.set(linkName,linkObject);
      linkData.push({name:linkName,inertial:linkObject.userData.inertial,visual:visualData,collision:collisionData});
    }
    const joints=[];
    const childLinks=new Set();
    for(const jointElement of directChildren(main.robot,'joint')){
      const name=jointElement.getAttribute('name')||`joint_${joints.length+1}`;
      const type=jointElement.getAttribute('type')||'fixed';
      const parent=directChild(jointElement,'parent')?.getAttribute('link')||'';
      const child=directChild(jointElement,'child')?.getAttribute('link')||'';
      const origin=parseOrigin(jointElement);
      const axisAttribute=directChild(jointElement,'axis')?.getAttribute('xyz');
      const [axisX,axisY,axisZ]=axisAttribute?parseNumbers(axisAttribute,3,0):[1,0,0];
      const limitElement=directChild(jointElement,'limit');
      const limit=limitElement?Object.fromEntries(['lower','upper','effort','velocity'].map(key=>[key,Number(limitElement.getAttribute(key))||0])):null;
      const dynamics=parseElementAttributes(directChild(jointElement,'dynamics'));
      const mimic=parseElementAttributes(directChild(jointElement,'mimic'));
      const safetyController=parseElementAttributes(directChild(jointElement,'safety_controller'));
      const calibration=parseElementAttributes(directChild(jointElement,'calibration'));
      const pivot=new THREE.Group();
      pivot.name=name;
      pivot.userData.urdfJoint={name,type,parent,child,origin,axis:{x:axisX,y:axisY,z:axisZ},limit,dynamics,mimic,safetyController,calibration};
      applyUrdfOrigin(pivot,origin);
      const parentObject=linkObjects.get(parent);
      const childObject=linkObjects.get(child);
      if(parentObject&&childObject){
        parentObject.add(pivot);
        pivot.add(childObject);
        childLinks.add(child);
      }else{
        warnings.push(`${name}: parent/child link 不完整`);
      }
      joints.push({
        name,
        modelNodeName:name,
        reportedJointName:name,
        type,
        controllable:type!=='fixed',
        positionScale:1,
        positionOffsetDeg:0,
        rotationReference:'relative',
        rotationSpace:'local',
        axis:{x:axisX,y:axisY,z:axisZ},
        origin,
        limit,
        dynamics,
        mimic,
        safetyController,
        calibration,
        parentLinkName:parent,
        childLinkName:child
      });
    }
    for(const [name,linkObject] of linkObjects){
      if(!childLinks.has(name)) robotRoot.add(linkObject);
    }
    const previousJointState=captureJointRuntimeState();
    clearModel();
    currentPackageUrls=packageUrls;
    currentModel=robotRoot;
    urdfData={
      name:robotRoot.name,
      sourceUrdf:main.record.path,
      modelRotationDeg:{x:0,y:0,z:0},
      modelRotationOrder:'XYZ',
      links:linkData,
      joints
    };
    jsonInput.value=JSON.stringify({urdf:urdfData},null,2);
    scene.add(currentModel);
    const restoredCount=setupJointsFromURDF(false,previousJointState);
    fitCameraToScene();
    modelFileName.textContent=`${packageLabel} · ${main.record.path}`;
    const movable=joints.filter(joint=>joint.controllable).length;
    setStatus(`URDF 已加载：${linkObjects.size} links，${joints.length} joints，${movable} 个可驱动${warnings.length?`，${warnings.length} 个资源警告`:''}`);
    if(restoredCount) showToast(`已恢复 ${restoredCount} 个同名关节的控制值`,'success');
    if(warnings.length) console.warn('URDF package warnings:',warnings);
  }

  async function handleUrdfPackage(records,label){
    if(!records.length) return;
    try{
      await loadUrdfPackage(records,label);
    }catch(error){
      console.error('URDF package load failed',error);
      setStatus(`URDF 加载失败：${error.message}`);
    }
  }

    const sameOriginUrl=path=>{
      const url=new URL(path,location.href);
      if(url.origin!==location.origin) throw new Error('测试文件必须与页面同源');
      return url;
    };
    const urdfPath=params.get('urdf');
    if(urdfPath){
      const urdfResponse=await fetch(sameOriginUrl(urdfPath));

      jsonInput.value=await urdfResponse.text();

    const modelResponse=await fetch(modelUrl);

  }

  function applyModelRootRotation(){
    if(!currentModel) return;
    const configured=urdfData&&urdfData.modelRotationDeg;
    const numberOr=(value,fallback)=>{
      if(value===null || value===undefined || value==='') return fallback;
      const number=Number(value);
      return Number.isFinite(number)?number:fallback;
    };
    const rotation={
      x:numberOr(configured&&configured.x,90),
      y:numberOr(configured&&configured.y,0),
      z:numberOr(configured&&configured.z,0)
    };
    const requestedOrder=String(urdfData&&urdfData.modelRotationOrder||'XYZ').toUpperCase();
    const order=['XYZ','YZX','ZXY','XZY','YXZ','ZYX'].includes(requestedOrder)?requestedOrder:'XYZ';
    currentModel.rotation.set(
      THREE.MathUtils.degToRad(rotation.x),
      THREE.MathUtils.degToRad(rotation.y),
      THREE.MathUtils.degToRad(rotation.z),
      order
    );
    currentModel.updateMatrixWorld(true);
  }

  function captureJointRuntimeState(){
    const state={};
    for(const [name,joint] of Object.entries(jointMap)){
      state[name]={
        val:Number.isFinite(Number(joint.value))?Number(joint.value):0,
        applied:Boolean(joint.hasAppliedValue),
        reportedRadians:joint.lastReportedRadians,
        reportedDegrees:joint.lastReportedDegrees
      };
    }
    return state;
  }

  function setupJointsFromURDF(preserveValues,runtimeState=null){
    const prevValues=runtimeState||{};
    if(preserveValues){
      for(const k in jointMap){
        prevValues[k]={
          val:jointMap[k].value,
          init:jointMap[k].initialQuaternion?jointMap[k].initialQuaternion.clone():jointMap[k].node.quaternion.clone(),
          initPosition:jointMap[k].initialPosition?jointMap[k].initialPosition.clone():jointMap[k].node.position.clone(),
          applied:Boolean(jointMap[k].hasAppliedValue),
          reportedRadians:jointMap[k].lastReportedRadians,
          reportedDegrees:jointMap[k].lastReportedDegrees
        };
      }
    }
    let restoredCount=0;
    jointMap={};
    jointControls.innerHTML='';
    document.getElementById('jointEditor').classList.remove('active');
    if(!urdfData||!Array.isArray(urdfData.joints)){
      renderJointDiagnostics();
      return;
    }
    urdfData.joints.forEach(j=>{
      if(j.type==='fixed'||j.controllable===false) return;
      const requestedNodeName=j.modelNodeName||j.name;
      const candidates=[];
      currentModel.traverse(candidate=>{
        if(!candidate.name) return;
        const exact=candidate.name===requestedNodeName;
        const numbered=candidate.name.startsWith(requestedNodeName+'.') &&
          /^\.\d+$/.test(candidate.name.slice(requestedNodeName.length));
        // GLTFLoader 会把 Blender 名称 joint6.001 清洗为 joint6001。
        const sanitizedNumbered=candidate.name.startsWith(requestedNodeName) &&
          /^\d{3}$/.test(candidate.name.slice(requestedNodeName.length));
        if(exact||numbered||sanitizedNumbered) candidates.push(candidate);
      });
      candidates.sort((a,b)=>{
        const aExact=a.name===requestedNodeName?0:1;
        const bExact=b.name===requestedNodeName?0:1;
        const aTransform=!a.isMesh&&a.children.length?0:1;
        const bTransform=!b.isMesh&&b.children.length?0:1;
        return aTransform-bTransform || aExact-bExact || a.name.localeCompare(b.name);
      });
      const node=candidates[0];
      if(!node){ return; }
      // 预填父子级（若无则基于骨骼层级推断）兼容 parentLinkName/childLinkName
      if(!j.parentLinkName || !j.childLinkName){
        const parentName=node.parent && node.parent.type!=='Scene' ? node.parent.name : '';
        let childName='';
        for(let c of node.children){ if(c.isBone||c.type==='Bone'){ childName=c.name; break; } }
        j.parentLinkName = j.parentLinkName || j.parent || parentName;
        j.childLinkName = j.childLinkName || j.child || childName;
      }
      const previous=prevValues[j.name];
      const val=previous?previous.val:0;
      const initQ=(preserveValues&&previous&&previous.init)?previous.init.clone():node.quaternion.clone();
      const initPosition=(preserveValues&&previous&&previous.initPosition)?previous.initPosition.clone():node.position.clone();
      const reportedJointName=j.reportedJointName||j.name;
      jointMap[j.name]={
        node:node,
        modelNodeName:node.name,
        axis:j.axis||{x:0,y:1,z:0},
        value:val,
        reportedJointName,
        positionScale:Number.isFinite(Number(j.positionScale))?Number(j.positionScale):1,
        positionOffsetDeg:Number.isFinite(Number(j.positionOffsetDeg))?Number(j.positionOffsetDeg):0,
        // 上报值是机械臂绝对关节角；GLB 节点旋转只提供固定坐标对齐与加载时的绑定姿态。
        // 仅配置明确指定 relative 时，才把角度增量叠加到 GLB 绑定姿态。
        rotationReference:j.rotationReference==='relative'?'relative':'absolute',
        // 未配置时使用骨骼局部轴；只有明确按父坐标轴定义时才指定 parent。
        rotationSpace:j.rotationSpace==='parent'?'parent':'local',
        jointType:j.type||'revolute',
        limit:j.limit||null,
        parentLinkName:j.parentLinkName||j.parent||'',
        childLinkName:j.childLinkName||j.child||'',
        originalMaterials:null,
        initialQuaternion:initQ,
        initialPosition:initPosition,
        hasAppliedValue:Boolean(previous&&previous.applied),
        lastReportedRadians:previous?previous.reportedRadians:null,
        lastReportedDegrees:previous?previous.reportedDegrees:null,
        appliedDegrees:Boolean(previous&&previous.applied)?val:null,
        renderedValue:Boolean(previous&&previous.applied)?val:null,
        targetValue:Boolean(previous&&previous.applied)?val:null,
        smoothReportedValue:false,
        axisHelper:null,
        controlDiv:null,
        slider:null,
        input:null,
        updateSliderTrack:null,
        syncControlUnit:null
      };
      if(jointMap[j.name].hasAppliedValue) restoredCount++;
      // 仅登记 URDF 时保持 Blender/GLB 的原始绑定姿态。
      // 已经应用过的值才在重建映射后恢复，避免把默认 0°误当成一次绝对姿态更新。
      if(jointMap[j.name].hasAppliedValue) applyJointRotation(j.name,val);

      const div=document.createElement('div'); div.className='joint-control';
      const label=document.createElement('div');
      label.textContent=j.name;
      label.style.width='100px';
      const slider=document.createElement('input');
      slider.type='range';
      const isPrismatic=jointMap[j.name].jointType==='prismatic';
      const lower=Number(j.limit&&j.limit.lower);
      const upper=Number(j.limit&&j.limit.upper);
      const valueMin=Number.isFinite(lower)&&Number.isFinite(upper)&&upper>lower
        ?(isPrismatic?lower:THREE.MathUtils.radToDeg(lower))
        :-360;
      const valueMax=Number.isFinite(lower)&&Number.isFinite(upper)&&upper>lower
        ?(isPrismatic?upper:THREE.MathUtils.radToDeg(upper))
        :360;
      slider.style.flex='1';
      function updateSliderTrack(){
        const min=Number(slider.min), max=Number(slider.max); const value=Number(slider.value)||0;
        const percent=(value-min)/(max-min); // 0..1
        const mid=(0-min)/(max-min); // 0.5
        const start=Math.min(percent, mid);
        const end=Math.max(percent, mid);
        // Build gradient with three zones: left gray, active dark (#333), right gray
        const grad=`linear-gradient(90deg, 
          #F4F4F8 0%, 
          #F4F4F8 ${start*100}%, 
          #333 ${start*100}%, 
          #333 ${end*100}%, 
          #F4F4F8 ${end*100}%, 
          #F4F4F8 100%)`;
        slider.style.background=grad;
      }
      const input=document.createElement('input'); input.type='number'; input.className='angle-input';
      function syncControlUnit(){
        const joint=jointMap[j.name];
        const displayMin=toJointDisplayValue(joint,valueMin);
        const displayMax=toJointDisplayValue(joint,valueMax);
        const displayStep=isPrismatic ? 0.001 : (jointAngleUnit==='rad' ? 0.001 : 1);
        // range 以 min 作为 step 网格原点。URDF 限位通常不是整数步长，直接赋值会让浏览器
        // 把 0 暗中修正成接近 0 的小数。在不超过物理限位的前提下，将边界对齐到以 0 为基准的网格。
        let sliderMin=displayMin;
        let sliderMax=displayMax;
        if(displayMin<=0&&displayMax>=0){
          const alignedMin=Math.ceil(displayMin/displayStep-1e-9)*displayStep;
          const alignedMax=Math.floor(displayMax/displayStep+1e-9)*displayStep;
          if(alignedMax>alignedMin){
            sliderMin=Number(alignedMin.toFixed(12));
            sliderMax=Number(alignedMax.toFixed(12));
          }
        }
        slider.min=sliderMin;
        slider.max=sliderMax;
        slider.step=displayStep;
        // 接口角度通常包含小数；允许输入框保留精度，避免浏览器因 step=1 判为无效值。
        input.step='any';
        const displayed=toJointDisplayValue(joint,joint.value);
        slider.value=Math.max(Number(slider.min),Math.min(Number(slider.max),displayed));
        input.value=formatJointDisplayValue(joint,joint.value);
        updateSliderTrack();
      }

      slider.addEventListener('input',()=>{
        const joint=jointMap[j.name];
        const displayed=parseFloat(slider.value);
        const value=fromJointDisplayValue(joint,displayed);
        joint.value=value;
        joint.hasAppliedValue=true;
        joint.appliedDegrees=value;
        joint.renderedValue=value;
        joint.targetValue=value;
        joint.smoothReportedValue=false;
        input.value=formatJointDisplayValue(joint,value);
        applyJointRotation(j.name,value);
        updateSliderTrack();
        renderJointDiagnostics();
      });
      input.addEventListener('change',()=>{
        const joint=jointMap[j.name];
        let displayed=parseFloat(input.value);
        if(isNaN(displayed)) displayed=0;
        displayed=Math.max(Number(slider.min),Math.min(Number(slider.max),displayed));
        const value=fromJointDisplayValue(joint,displayed);
        input.value=formatJointDisplayValue(joint,value);
        slider.value=displayed;
        joint.value=value;
        joint.hasAppliedValue=true;
        joint.appliedDegrees=value;
        joint.renderedValue=value;
        joint.targetValue=value;
        joint.smoothReportedValue=false;
        applyJointRotation(j.name,value);
        updateSliderTrack();
        renderJointDiagnostics();
      });
      
      // Prevent click event from bubbling when clicking on input or slider
      input.addEventListener('click',(e)=>{ e.stopPropagation(); });
      slider.addEventListener('click',(e)=>{ e.stopPropagation(); });

      div.appendChild(label); div.appendChild(slider); div.appendChild(input);
      jointControls.appendChild(div);
      jointMap[j.name].controlDiv=div;
      jointMap[j.name].slider=slider;
      jointMap[j.name].input=input;
      jointMap[j.name].updateSliderTrack=updateSliderTrack;
      jointMap[j.name].syncControlUnit=syncControlUnit;
      syncControlUnit();

      div.addEventListener('click',()=>{ highlightJoint(j.name); });
    });
    const selectedName=highlightedJoint&&jointMap[highlightedJoint]
      ?highlightedJoint
      :Object.keys(jointMap)[0];
    if(selectedName){
      jointControls.querySelectorAll('.joint-control').forEach(d=>d.classList.remove('selected'));
      jointMap[selectedName].controlDiv?.classList.add('selected');
      toggleJointEditor(true,selectedName);
    }
    renderJointDiagnostics();
    return restoredCount;
  }

  function applyLatestJointStates(joints){
    const statesByName=new Map();
    const targetSide=joints.find(state=>state.armSide)?.armSide||'';
    const otherSide=targetSide==='left'?'right':targetSide==='right'?'left':'';
    for(const state of joints){
      statesByName.set(state.name,state);
      if(state.armSide){
        statesByName.set(`${state.name}_${state.armSide}`,state);
        statesByName.set(`${state.armSide}_${state.name}`,state);
      }
    }
    const matchedStates=new Set();
    const missingConfigured=[];
    const details=[];
    let applied=0;
    for(const modelJointName in jointMap){
      const joint=jointMap[modelJointName];
      const sideNames=`${modelJointName} ${joint.reportedJointName}`;
      if(otherSide && (
        sideNames.includes(`_${otherSide}`) ||
        sideNames.includes(`${otherSide}_`)
      )){
        continue;
      }
      const state=statesByName.get(joint.reportedJointName);
      if(!state){
        missingConfigured.push(joint.reportedJointName);
        details.push({
          reportedName:joint.reportedJointName,
          modelName:modelJointName,
          matched:false
        });
        continue;
      }
      matchedStates.add(state);
      const reportedDegrees=joint.jointType==='prismatic'
        ?Number(state.position)
        :THREE.MathUtils.radToDeg(state.position);
      const degrees=reportedDegrees*joint.positionScale+joint.positionOffsetDeg;
      const canSmooth=joint.hasAppliedValue&&Number.isFinite(joint.renderedValue);
      joint.value=degrees;
      joint.hasAppliedValue=true;
      joint.lastReportedRadians=Number(state.position);
      joint.lastReportedDegrees=reportedDegrees;
      joint.appliedDegrees=degrees;
      joint.targetValue=degrees;
      if(canSmooth){
        joint.smoothReportedValue=true;
      }else{
        joint.renderedValue=degrees;
        joint.smoothReportedValue=false;
        applyJointRotation(modelJointName,degrees);
      }
      if(joint.syncControlUnit) joint.syncControlUnit();
      details.push({
        reportedName:joint.reportedJointName,
        modelName:modelJointName,
        reportedDegrees,
        mappedDegrees:degrees,
        matched:true
      });
      applied++;
    }
    const unmappedReported=joints
      .filter(state=>!matchedStates.has(state))
      .map(state=>state.name);
    for(const state of joints){
      if(matchedStates.has(state)) continue;
      details.push({
        reportedName:state.name,
        modelName:'未配置',
        reportedDegrees:THREE.MathUtils.radToDeg(state.position),
        matched:false
      });
    }
    renderJointDiagnostics();
    return {received:joints.length,applied,missingConfigured,unmappedReported,details,armSide:targetSide};
  }

  function renderJointMappingResult(mapping){
    const notes=[];
    if(mapping.unmappedReported.length) notes.push(`未映射：${mapping.unmappedReported.join(', ')}`);
    if(mapping.missingConfigured.length) notes.push(`未收到：${mapping.missingConfigured.join(', ')}`);

  function parseLooseJson(text){
    const trimmed=text.trim();
    if(!trimmed) throw new Error('请先粘贴关节数据');
    try{
      return JSON.parse(trimmed);
    }catch(originalError){
      let candidate=trimmed;
      if(/^"[^"]+"\s*:/.test(candidate)) candidate='{'+candidate;
      const stack=[];
      let inString=false;
      let escaped=false;
      for(const char of candidate){
        if(inString){
          if(escaped) escaped=false;
          else if(char==='\\') escaped=true;
          else if(char==='"') inString=false;
          continue;
        }
        if(char==='"'){ inString=true; continue; }
        if(char==='{' || char==='[') stack.push(char);
        else if(char==='}' || char===']'){
          const expected=char==='}'?'{':'[';
          if(stack.pop()!==expected) throw originalError;
        }
      }
      while(stack.length){
        candidate+=stack.pop()==='{'?'}':']';
      }
      candidate=candidate.replace(/,\s*([}\]])/g,'$1');
      return JSON.parse(candidate);
    }
  }

  function splitJsonDocuments(text){
    const documents=[];
    let start=-1;
    let depth=0;
    let inString=false;
    let escaped=false;
    for(let index=0;index<text.length;index++){
      const char=text[index];
      if(inString){
        if(escaped) escaped=false;
        else if(char==='\\') escaped=true;
        else if(char==='"') inString=false;
        continue;
      }
      if(char==='"'){ inString=true; continue; }
      if(char==='{' || char==='['){
        if(depth===0) start=index;
        depth++;
      }else if(char==='}' || char===']'){
        depth--;
        if(depth===0 && start>=0){
          documents.push(text.slice(start,index+1));
          start=-1;
        }
      }
    }
    return documents;
  }

  function parsePastedJointStates(text,armIndex){
    const documents=splitJsonDocuments(text);
    const selectedText=documents.length>1
      ?documents[armIndex]
      :text;
    if(documents.length>1 && !selectedText){
      throw new Error(`粘贴内容只有 ${documents.length} 段，找不到机械臂编号 ${armIndex} 对应的数据`);
    }
    const payload=parseLooseJson(selectedText);
    let armSide=armIndex===0?'left':armIndex===1?'right':'';
    let joints=Array.isArray(payload)
      ?payload
      :(payload.joints||payload.data?.joints||payload.message?.joints);
    if(!Array.isArray(joints) && payload.arms && typeof payload.arms==='object'){
      const arms=Object.entries(payload.arms)
        .filter(([,arm])=>arm && Array.isArray(arm.joints));
      const selected=arms.find(([,arm])=>Number(arm.index)===armIndex)||arms[0];
      if(selected){
        armSide=selected[0];
        joints=selected[1].joints;
      }
    }
    if(!Array.isArray(joints)) throw new Error('JSON 中没有找到 joints 数组');
    return joints.map((state,index)=>{
      const name=String(state.name||'').trim();
      const position=Number(state.position);
      if(!name || !Number.isFinite(position)){
        throw new Error(`第 ${index+1} 个关节缺少有效的 name 或 position`);
      }
      return {
        name,
        position,
        armSide,
        velocity:Number.isFinite(Number(state.velocity))?Number(state.velocity):undefined,
        effort:Number.isFinite(Number(state.effort))?Number(state.effort):undefined
      };
    });
  }

  const jointPollingIntervalMs=200;
  let jointPollingActive=false;
  let jointPollingTimer=null;
  let jointFetchInFlight=false;
  let jointFetchController=null;

  function updateJointPollingControls(){
    getLatestJointsBtn.disabled=jointPollingActive||jointFetchInFlight;
    toggleContinuousJointsBtn.classList.toggle('active',jointPollingActive);
    toggleContinuousJointsBtn.innerHTML=jointPollingActive
      ?'<i class="fa-solid fa-stop"></i> 停止获取'
      :'<i class="fa-solid fa-play"></i> 持续获取';
  }

  function stopJointPolling(showStatus=true){
    jointPollingActive=false;
    if(jointPollingTimer){
      clearTimeout(jointPollingTimer);
      jointPollingTimer=null;
    }
    if(jointFetchController) jointFetchController.abort();
    updateJointPollingControls();
    if(showStatus) setStatus('已停止持续获取关节数据');
  }

  async function fetchLatestJointStates(continuous=false){
    if(jointFetchInFlight) return false;
    const armIndex=Number(armIndexInput.value);
    const grpcUrl=grpcBaseUrl.value.trim();
    const requestConfig=`${grpcUrl}\n${armIndex}`;
    jointFetchInFlight=true;
    jointFetchController=new AbortController();
    updateJointPollingControls();
    if(!continuous) grpcResult.textContent='正在获取...';
    try{
      const isGrpcUi=/\/grpcui\/?$/i.test(grpcUrl);
      if(isGrpcUi && location.protocol==='file:'){
        throw new Error('请运行 node server.mjs，并通过 http://127.0.0.1:8000 打开页面');
      }
      if(isGrpcUi && location.hostname.endsWith('.github.io')){
        throw new Error('GitHub Pages 不运行 grpcui 代理；请使用本地 node server.mjs，或手动粘贴 Response Data');
      }
      const joints=isGrpcUi
        ?await window.grpcArmJoints.getLatestArmJointStatesViaLocalProxy(grpcUrl,armIndex,{signal:jointFetchController.signal})
        :await window.grpcArmJoints.getLatestArmJointStates(grpcUrl,armIndex,{signal:jointFetchController.signal});
      if(requestConfig!==`${grpcBaseUrl.value.trim()}\n${Number(armIndexInput.value)}`) return false;
      rememberGrpcUrl(grpcUrl);
      const armSide=armIndex===0?'left':armIndex===1?'right':'';
      for(const state of joints) state.armSide=armSide;
      latestReportedJointStates=joints;
      const mapping=applyLatestJointStates(joints);
      renderJointMappingResult(mapping);
      setStatus('机械臂关节数据已更新');
      return true;
    }catch(error){
      if(error.name==='AbortError') return false;
      grpcResult.textContent='获取失败：'+error.message;
      setStatus('机械臂关节数据获取失败');
      showToast(`关节数据获取失败：${error.message}`,'error',5000);
      if(continuous) stopJointPolling(false);
      return false;
    }finally{
      jointFetchInFlight=false;
      jointFetchController=null;
      updateJointPollingControls();
    }
  }

  async function runJointPolling(){
    jointPollingTimer=null;
    if(!jointPollingActive||document.hidden) return;
    const startedAt=performance.now();
    await fetchLatestJointStates(true);
    if(jointPollingActive&&!document.hidden){
      const elapsed=performance.now()-startedAt;
      jointPollingTimer=setTimeout(runJointPolling,Math.max(30,jointPollingIntervalMs-elapsed));
    }
  }

  });

  toggleContinuousJointsBtn.addEventListener('click',()=>{
    if(jointPollingActive){
      stopJointPolling();
      return;
    }
    jointPollingActive=true;
    updateJointPollingControls();
    setStatus('正在持续获取关节数据');
    runJointPolling();
  });

  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){
      if(jointPollingTimer){
        clearTimeout(jointPollingTimer);
        jointPollingTimer=null;
      }
      if(jointFetchController) jointFetchController.abort();
    }else if(jointPollingActive&&!jointFetchInFlight&&!jointPollingTimer){
      runJointPolling();
    }
  });

  applyJointStatesBtn.addEventListener('click',()=>{
    try{
      const armIndex=Number(armIndexInput.value);
      const joints=parsePastedJointStates(jointStatesInput.value,armIndex);
      latestReportedJointStates=joints;
      renderJointMappingResult(applyLatestJointStates(joints));
      setStatus('粘贴的机械臂关节数据已应用');
    }catch(error){
      grpcResult.textContent='粘贴数据错误：'+error.message;
      setStatus('关节数据应用失败');
    }
  });

  // 当 JSON 为空时，点击模型关节生成关节 JSON
  function generateJointsFromModel(){
    if(!currentModel) return [];
    const joints=[];
    currentModel.traverse(child=>{
      if(child.isBone || child.type==='Bone'){
        const parentName=child.parent && child.parent.type!=='Scene' ? child.parent.name : '';
        let childName='';
        for(let c of child.children){ if(c.isBone||c.type==='Bone'){ childName=c.name; break; } }
        joints.push({
          name:child.name,
          reportedJointName:child.name,
          positionScale:1,
          positionOffsetDeg:0,
          rotationReference:'absolute',
          rotationSpace:'local',
          axis:{x:0,y:1,z:0},
          parentLinkName:parentName,
          childLinkName:childName
        });
      }
    });
    return joints;
  }

  function extractAxisTwist(quaternion,axis){
    const projected=quaternion.x*axis.x+quaternion.y*axis.y+quaternion.z*axis.z;
    const twist=new THREE.Quaternion(
      axis.x*projected,
      axis.y*projected,
      axis.z*projected,
      quaternion.w
    );
    const lengthSq=twist.x*twist.x+twist.y*twist.y+twist.z*twist.z+twist.w*twist.w;
    if(lengthSq<1e-12) return new THREE.Quaternion();
    return twist.normalize();
  }

  function getAxisTwistDegrees(joint){
    if(!joint||!joint.initialQuaternion) return 0;
    const axis=new THREE.Vector3(joint.axis.x||0,joint.axis.y||0,joint.axis.z||0).normalize();
    if(axis.lengthSq()===0) return 0;
    const twist=extractAxisTwist(joint.initialQuaternion,axis);
    const signedSinHalf=twist.x*axis.x+twist.y*axis.y+twist.z*axis.z;
    let degrees=THREE.MathUtils.radToDeg(2*Math.atan2(signedSinHalf,twist.w));
    degrees=((degrees+180)%360+360)%360-180;
    return degrees;
  }

  function restoreJointBindPose(joint){
    if(!joint||!joint.node||!joint.initialQuaternion) return;
    joint.node.quaternion.copy(joint.initialQuaternion);
    if(joint.initialPosition) joint.node.position.copy(joint.initialPosition);
    joint.hasAppliedValue=false;
    joint.appliedDegrees=null;
    joint.renderedValue=null;
    joint.targetValue=null;
    joint.smoothReportedValue=false;
  }

  function applyJointRotation(name,deg){
    const j=jointMap[name]; if(!j) return;
    const ax=new THREE.Vector3(j.axis.x||0,j.axis.y||0,j.axis.z||0).normalize();
    if(ax.lengthSq()===0) return;
    if(!j.initialQuaternion) j.initialQuaternion=j.node.quaternion.clone();
    if(j.jointType==='prismatic'){
      if(!j.initialPosition) j.initialPosition=j.node.position.clone();
      j.node.position.copy(j.initialPosition).addScaledVector(ax,deg);
      return;
    }
    const jointQ=new THREE.Quaternion().setFromAxisAngle(ax,THREE.MathUtils.degToRad(deg));
    if(j.rotationReference==='absolute'){
      // GLB 的绑定姿态可能已在关节轴上带有 ±90°/180°。
      // 上报 position 是绝对关节角：只移除绑定四元数在该轴上的 twist，
      // 保留其余 swing 作为 GLB 坐标系固定对齐，因而无需按型号写死偏移。
      const bindTwist=extractAxisTwist(j.initialQuaternion,ax);
      if(j.rotationSpace==='parent'){
        const fixedSwing=bindTwist.clone().invert().multiply(j.initialQuaternion);
        j.node.quaternion.copy(jointQ).multiply(fixedSwing);
      }else{
        const fixedSwing=j.initialQuaternion.clone().multiply(bindTwist.clone().invert());
        j.node.quaternion.copy(fixedSwing).multiply(jointQ);
      }
      return;
    }
    if(j.rotationSpace==='parent'){
      j.node.quaternion.copy(jointQ).multiply(j.initialQuaternion);
    }else{
      j.node.quaternion.copy(j.initialQuaternion).multiply(jointQ);
    }
  }

  let selfCheckActive=false;
  selfCheckBtn.addEventListener('click',()=>{
    selfCheckActive=!selfCheckActive;
    setSelfCheckLabel(selfCheckActive?'停止自检':'开始自检');
  });

  function traverseMeshes(root, fn){ root.traverse(n=>{ if(n.isMesh){ fn(n); } }); }
  function makeAxisGizmo(length, thickness){
    const group=new THREE.Group();
    const createAxis=(color, dir)=>{
      const mat=new THREE.MeshBasicMaterial({color:color});
      const shaftGeom=new THREE.CylinderGeometry(thickness, thickness, length*0.8, 8);
      const shaft=new THREE.Mesh(shaftGeom, mat);
      const coneGeom=new THREE.ConeGeometry(thickness*3, length*0.2, 12);
      const tip=new THREE.Mesh(coneGeom, mat);
      // Orientation
      shaft.rotation.z = dir==='x'?Math.PI/2:0;
      shaft.rotation.x = dir==='z'?Math.PI/2:0;
      tip.rotation.z = dir==='x'?Math.PI/2:0;
      tip.rotation.x = dir==='z'?Math.PI/2:0;
      // Position along axis
      shaft.position[dir]=(length*0.8)/2;
      tip.position[dir]=length*0.9;
      const axisGroup=new THREE.Group();
      axisGroup.add(shaft);
      axisGroup.add(tip);
      return axisGroup;
    };
    const x=createAxis(0xff5555,'x');
    const y=createAxis(0x55ff55,'y');
    const z=createAxis(0x5582ff,'z');
    group.add(x,y,z);
    return group;
  }
  function highlightJoint(name){
  if(highlightedJoint) unhighlight(highlightedJoint);
  const j=jointMap[name]; if(!j) return;
  // 左侧滑轨列表高亮对应项
  jointControls.querySelectorAll('.joint-control').forEach(d=>d.classList.remove('selected'));
  if(j.controlDiv){ j.controlDiv.classList.add('selected'); try{ j.controlDiv.scrollIntoView({behavior:'smooth', block:'nearest'}); }catch(e){} }
  if(!j.originalMaterials){
    j.originalMaterials=new Map();
    traverseMeshes(j.node, mesh=>{ j.originalMaterials.set(mesh.uuid, mesh.material); });
  }
  traverseMeshes(j.node, mesh=>{
    mesh.material=mesh.material.clone();
    if(mesh.material.color) mesh.material.color.set(0x5582FF);
  });
  if(j.axisHelper){ j.node.remove(j.axisHelper); }
  const gizmo=makeAxisGizmo(gizmoLength, gizmoThickness);
  j.node.add(gizmo);
  j.axisHelper=gizmo;
  highlightedJoint=name;
  toggleJointEditor(true,name);
  // 新增：定位并高亮 JSON 中对应关节
  focusJointInJson(name);
}

  function unhighlight(name){
  const j=jointMap[name]; if(!j) return;
  if(j.originalMaterials){ traverseMeshes(j.node, mesh=>{ const m=j.originalMaterials.get(mesh.uuid); if(m) mesh.material=m; }); }
  if(j.axisHelper){ j.node.remove(j.axisHelper); j.axisHelper=null; }
  toggleJointEditor(false);
}

  const raycaster=new THREE.Raycaster();
  const mouse=new THREE.Vector2();
  renderer.domElement.addEventListener('click',event=>{
    if(!currentModel) return;
    const rect=renderer.domElement.getBoundingClientRect();
    mouse.x=((event.clientX-rect.left)/rect.width)*2-1;
    mouse.y=-((event.clientY-rect.top)/rect.height)*2+1;
    raycaster.setFromCamera(mouse,camera);
    const intersects=raycaster.intersectObjects(currentModel.children,true);
    if(intersects.length>0){
      let obj=intersects[0].object;
      while(obj && !jointMap[obj.name]){ obj=obj.parent; }
      if(obj && jointMap[obj.name]){ highlightJoint(obj.name); }
      else {
        let shouldGenerate=false;
        const raw=jsonInput.value.trim();
        if(raw==='') { shouldGenerate=true; }
        else {
          try{
            const data=JSON.parse(raw);
            const u=data.urdf&&Array.isArray(data.urdf.joints)?data.urdf:data;
            if(!u || !Array.isArray(u.joints) || u.joints.length===0) shouldGenerate=true;
          }catch(e){ shouldGenerate=true; }
        }
        if(shouldGenerate){
          const autoJoints=generateJointsFromModel();
          urdfData={joints:autoJoints};
          jsonInput.value=JSON.stringify({urdf:{joints:autoJoints}},null,2);
          setupJointsFromURDF(false);
          setStatus('已从模型骨骼生成关节 JSON');
        }
      }
    }else{
      if(highlightedJoint){ unhighlight(highlightedJoint); highlightedJoint=null; }
    }
  });

  copyBtn.addEventListener('click', ()=>{
    try {
      const editedJSON = jsonInput.value;
      JSON.parse(editedJSON);
      navigator.clipboard.writeText(editedJSON).then(()=>{
        setStatus('JSON 已复制到剪贴板！');
      }).catch(err=>{
        setStatus('复制失败: '+err);
      });
    } catch(e){
      setStatus('JSON 格式错误: '+e.message);
    }
  });

  document.querySelectorAll('.view-buttons button').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(btn.dataset.view==='map'){
        if(!mapPlane || !currentMap) return;
        const size=getMapSize(currentMap);
        const maxDim=Math.max(size.width,size.height,1);
        const fov=camera.fov * (Math.PI/180);
        const distance=maxDim / (2*Math.tan(fov/2)) * 1.2;
        const center=new THREE.Vector3(currentMap.center.x,currentMap.center.y,mapPlane.position.z);
        camera.position.set(center.x,center.y,center.z+distance);
        camera.lookAt(center);
        controls.target.copy(center);
        controls.update();
        return;
      }
      if(!currentModel) return;
      const box=new THREE.Box3().setFromObject(currentModel);
      const size=box.getSize(new THREE.Vector3());
      const center=box.getCenter(new THREE.Vector3());
      const maxDim=Math.max(size.x,size.y,size.z);
      const fov=camera.fov * (Math.PI/180);
      const distance=maxDim / (2*Math.tan(fov/2)) * 1.2;
      switch(btn.dataset.view){
        case 'top': camera.position.set(center.x, center.y, center.z+distance); break;
        case 'bottom': camera.position.set(center.x, center.y, center.z-distance); break;
        case 'front': camera.position.set(center.x, center.y+distance, center.z); break;
        case 'back': camera.position.set(center.x, center.y-distance, center.z); break;
        case 'left': camera.position.set(center.x-distance, center.y, center.z); break;
        case 'right': camera.position.set(center.x+distance, center.y, center.z); break;
      }
      camera.lookAt(center);
      controls.target.copy(center);
      controls.update();
    });
  });

  loadScenarioFromQuery().catch(error=>{
    console.error('测试场景加载失败',error);
    setStatus(error.message);
  });

  let previousFrameTime=performance.now();
  function animate(frameTime){
    requestAnimationFrame(animate);
    const currentFrameTime=Number.isFinite(frameTime)?frameTime:performance.now();
    const deltaSeconds=Math.min(Math.max((currentFrameTime-previousFrameTime)/1000,0),0.1);
    previousFrameTime=currentFrameTime;
    controls.update();
    if(selfCheckActive){
      const t=Date.now()*0.001;
      for(const k in jointMap){
        const j=jointMap[k];
        const min=Number(j.slider&&j.slider.min);
        const max=Number(j.slider&&j.slider.max);
        const val=j.jointType==='prismatic'&&Number.isFinite(min)&&Number.isFinite(max)
          ?min+(Math.sin(t)+1)*(max-min)/2
          :Math.sin(t)*360;
        applyJointRotation(k,val);
      }
    }else{
      const smoothingAlpha=1-Math.exp(-deltaSeconds*12);
      for(const [name,joint] of Object.entries(jointMap)){
        if(!joint.smoothReportedValue||!Number.isFinite(joint.targetValue)||!Number.isFinite(joint.renderedValue)) continue;
        const difference=joint.targetValue-joint.renderedValue;
        const threshold=joint.jointType==='prismatic'?0.00001:0.01;
        if(Math.abs(difference)<=threshold){
          joint.renderedValue=joint.targetValue;
          joint.smoothReportedValue=false;
        }else{
          joint.renderedValue+=difference*smoothingAlpha;
        }
        applyJointRotation(name,joint.renderedValue);
      }
    }
    renderer.render(scene,camera);
  }
  animate();
});
})();
</script>
