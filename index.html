<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Payen Tools-GLB URDF JSON Viewer</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
    }
  }
  </script>
  <style>
    body { margin: 0; display: flex; height: 100vh; overflow:hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, Pingfang; background:#222; }
    #sidebar { flex:0 0 500px; width:500px; background: #f6f7f9; margin: 16px; box-sizing: border-box; overflow: auto; border-right: 1px solid #ddd; border-radius: 16px; padding:8px 16px; opacity:1; transition:flex-basis 0.22s ease, width 0.22s ease, margin 0.22s ease, padding 0.22s ease, opacity 0.18s ease; }

    #viewerShell { min-width:0; flex:1; position:relative; background:#222; }
    #viewerShell.maximized { position:fixed; inset:0; z-index:2500; background:#222; }
    #viewer { position:absolute; inset:0; background: #f4fcfe; }
    #viewer canvas { display:block; }
    #viewerShell:fullscreen { background:#222; }
    .sidebar-head { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; padding-top:2px; }
    .sidebar-head h3 { min-width:0; }
    .panel-actions, .viewer-toolbar { display:flex; align-items:center; gap:8px; }
    .viewer-toolbar { position:absolute; top:20px; right:20px; z-index:20; }

    .section-head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .section-head h4 { margin:0; color:#333; font-size:14px; }
    .asset-panel-body { display:grid; gap:10px; margin-top:10px; }

    .file-row { display:flex; align-items:center; gap:8px; min-width:0; }

    .json-buttons { position: absolute; bottom: 8px; left: 8px; display: flex; gap: 4px; }
    .json-buttons button { padding: 4px 8px; font-size: 11px; color:#666; background: #F7F7F7; border: none; border-radius: 4px; cursor: pointer; }

    .map-scale-row { display:flex; align-items:center; gap:8px; color:#555; font-size:12px; }

    button { flex:1; padding: 10px; cursor: pointer; border-radius: 8px; border: 1px solid #E8E8E8; background: #FFF; font-size: 12px; display:flex; align-items:center; justify-content:center; gap:6px; transition: background 0.2s, transform 0.1s; }

    input[type="range"]::-moz-range-thumb { background:#241F7D; width:14px; height:14px; border:none; border-radius:50%; }
  </style>
</head>
<body>
<div id="sidebar">
  <div class="sidebar-head">
    <h3>Payen Tools - GLB URDF JSON Viewer</h3>

<script type="module">
// 使用importmap解决模块依赖问题
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// 将THREE对象添加到全局作用域，以便现有代码可以访问
window.THREE = THREE;
window.GLTFLoader = GLTFLoader;
window.DRACOLoader = DRACOLoader;
window.OrbitControls = OrbitControls;
(function(){
window.addEventListener('load',()=>{
  // 确保 THREE 对象已加载
  if (typeof THREE === 'undefined') {
    console.error('THREE.js 未正确加载');
    document.getElementById('status').textContent = '状态：THREE.js 加载失败';
    return;
  }
  const statusEl=document.getElementById('status');
function toggleJointEditor(show, name){
  const editor=document.getElementById('jointEditor');
  if(show){
    editor.classList.add('active');
    document.getElementById('editorName').value=name;
    const j=jointMap[name];
    if(j){
      document.getElementById('editorParent').value=j.parentLinkName||j.parent||'';
      document.getElementById('editorChild').value=j.childLinkName||j.child||'';
      document.getElementById('editorReportedName').value=j.reportedJointName||name;
      document.getElementById('editorPositionScale').value=j.positionScale;
      document.getElementById('editorPositionOffset').value=j.positionOffsetDeg;
      document.getElementById('editorRotationSpace').value=j.rotationSpace;
      document.getElementById('editorRotationReference').value=j.rotationReference;
      document.getElementById('editorDetectedBindAngle').value=Number(getAxisTwistDegrees(j).toFixed(3));
      document.getElementById('axisX').value=j.axis.x||0;
      document.getElementById('axisY').value=j.axis.y||0;
      document.getElementById('axisZ').value=j.axis.z||0;
    }
  } else {
    editor.classList.remove('active');
  }
}

//高亮滚动
function focusJointInJson(name){
  const ta=document.getElementById('jsonInput');
  if(!ta) return;
  const text=ta.value;
  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const re=new RegExp(`"name"\\s*:\\s*"${esc(name)}"`);
  const idx=text.search(re);
  if(idx===-1) return;

  // 选中包含 name 的整行
  let start=text.lastIndexOf('\n', idx);
  start = start === -1 ? 0 : start + 1;
  let end=text.indexOf('\n', idx);
  end = end === -1 ? text.length : end;

  ta.focus();
  try { ta.setSelectionRange(start, end); } catch(e){}

  // 平滑滚动到可见位置
  const before=text.slice(0,start);
  const totalLines=text.split('\n').length;
  const lineNum=(before.match(/\n/g)||[]).length;
  const ratio=Math.min(1, Math.max(0, (lineNum-3)/(totalLines||1)));
  ta.scrollTop = ratio * (ta.scrollHeight - ta.clientHeight);
}


function populateJointNames(){
  const jointNames=[];
  if(currentModel){
    currentModel.traverse(n=>{ if(n.isBone||n.type==="Bone") jointNames.push(n.name); });
  }
  return jointNames;
}

function saveJointEdits(){
  const name=document.getElementById('editorName').value;
  if(!jointMap[name]) return;
  jointMap[name].axis={
    x:parseFloat(document.getElementById('axisX').value)||0,
    y:parseFloat(document.getElementById('axisY').value)||0,
    z:parseFloat(document.getElementById('axisZ').value)||0
  };
  jointMap[name].parentLinkName=document.getElementById('editorParent').value;
  jointMap[name].childLinkName=document.getElementById('editorChild').value;
  jointMap[name].reportedJointName=document.getElementById('editorReportedName').value.trim()||name;
  const positionScale=parseFloat(document.getElementById('editorPositionScale').value);
  const positionOffsetDeg=parseFloat(document.getElementById('editorPositionOffset').value);
  jointMap[name].positionScale=Number.isFinite(positionScale)?positionScale:1;
  jointMap[name].positionOffsetDeg=Number.isFinite(positionOffsetDeg)?positionOffsetDeg:0;
  jointMap[name].rotationSpace=document.getElementById('editorRotationSpace').value==='parent'?'parent':'local';
  jointMap[name].rotationReference=document.getElementById('editorRotationReference').value==='relative'?'relative':'absolute';
  const joints=[];
  for(const k in jointMap){
    joints.push({
      name:k,
      modelNodeName:jointMap[k].modelNodeName!==k?jointMap[k].modelNodeName:undefined,
      reportedJointName:jointMap[k].reportedJointName,
      positionScale:jointMap[k].positionScale,
      positionOffsetDeg:jointMap[k].positionOffsetDeg,
      rotationReference:jointMap[k].rotationReference,
      rotationSpace:jointMap[k].rotationSpace,
      axis:jointMap[k].axis,
      parentLinkName:jointMap[k].parentLinkName||jointMap[k].parent||'',
      childLinkName:jointMap[k].childLinkName||jointMap[k].child||''
    });
    if(jointMap[k].axisHelper){
      jointMap[k].node.remove(jointMap[k].axisHelper);
      jointMap[k].axisHelper=null;
    }
  }
  urdfData={...(urdfData||{}),joints};
  jsonInput.value=JSON.stringify({urdf:urdfData},null,2);
  const controlLabel=jointMap[name].controlDiv&&jointMap[name].controlDiv.firstElementChild;
  if(controlLabel){
    controlLabel.textContent=name;
    controlLabel.removeAttribute('title');
  }
  if(latestReportedJointStates.length){
    renderJointMappingResult(applyLatestJointStates(latestReportedJointStates));
  }

  function getMapSize(map){
    if(map.displaySize){
      const scale=Number(map.scale)||1;
      return { width:map.displaySize.width*scale, height:map.displaySize.height*scale };
    }
    const metadata=map.metadata||{};
    const width=Number(metadata.width);
    const height=Number(metadata.height);
    const resolution=Number(metadata.resolution);
    if(width>0 && height>0 && resolution>0){
      return { width:width*resolution, height:height*resolution };
    }
    const imageWidth=map.imageWidth||1;
    const imageHeight=map.imageHeight||1;
    const aspect=imageWidth/imageHeight;
    const span=getMapAnchor().span;
    return aspect>=1 ? { width:span, height:span/aspect } : { width:span*aspect, height:span };
  }

    mapPlane.position.set(currentMap.center.x,currentMap.center.y,anchor.z);
    mapPlane.rotation.set(0,0,Number(currentMap.metadata&&currentMap.metadata.yaw)||0);

  function installMapTexture(texture, options){

    context.drawImage(image,0,0);
    const texture=new THREE.CanvasTexture(canvas);
    texture.minFilter=THREE.LinearFilter;
    texture.magFilter=THREE.LinearFilter;
    texture.generateMipmaps=false;
    texture.needsUpdate=true;

    setStatus('地图已加载');

  function getEmbeddedMap(json){
    const entities=Array.isArray(json.mapfileEntitys)?json.mapfileEntitys:[];
    const entity=entities.find(item=>item&&item.content&&Array.isArray(item.content.data));
    if(!entity) throw new Error('JSON 中未找到内嵌地图图片');
    const record=entity.record||{};
    return {
      bytes:new Uint8Array(entity.content.data),
      name:record.alias||record.name||'JSON 地图',
      metadata:{
        width:Number(record.width)||0,
        height:Number(record.height)||0,
        resolution:Number(record.resolution)||0,
        yaw:Number(record.origin&&record.origin.yaw)||0
      }
    };
  }

  async function loadMapFile(file){
    const lowerName=file.name.toLowerCase();
    if(file.type==='image/png' || lowerName.endsWith('.png')){
      await installMapBlob(file,{ name:file.name, metadata:null });
      return;
    }
    if(file.type==='application/json' || lowerName.endsWith('.json')){
      const json=JSON.parse(await file.text());
      const embeddedMap=getEmbeddedMap(json);
      const blob=new Blob([embeddedMap.bytes],{type:'image/png'});
      await installMapBlob(blob,{ name:embeddedMap.name, metadata:embeddedMap.metadata });
      return;
    }
    throw new Error('仅支持 JSON 或 PNG 地图文件');
  }

        if(!u||!Array.isArray(u.joints)||u.joints.length===0) shouldGenerate=true;

      }catch(e){ shouldGenerate=true; }
    }
    if(shouldGenerate){
      const autoJoints=generateJointsFromModel();
      urdfData={joints:autoJoints};
      jsonInput.value=JSON.stringify({urdf:{joints:autoJoints}},null,2);
    }

  function applyModelRootRotation(){
    if(!currentModel) return;
    const configured=urdfData&&urdfData.modelRotationDeg;
    const numberOr=(value,fallback)=>{
      if(value===null || value===undefined || value==='') return fallback;
      const number=Number(value);
      return Number.isFinite(number)?number:fallback;
    };
    const rotation={
      x:numberOr(configured&&configured.x,90),
      y:numberOr(configured&&configured.y,0),
      z:numberOr(configured&&configured.z,0)
    };
    const requestedOrder=String(urdfData&&urdfData.modelRotationOrder||'XYZ').toUpperCase();
    const order=['XYZ','YZX','ZXY','XZY','YXZ','ZYX'].includes(requestedOrder)?requestedOrder:'XYZ';
    currentModel.rotation.set(
      THREE.MathUtils.degToRad(rotation.x),
      THREE.MathUtils.degToRad(rotation.y),
      THREE.MathUtils.degToRad(rotation.z),
      order
    );
    currentModel.updateMatrixWorld(true);
  }

  function setupJointsFromURDF(preserveValues){
    const prevValues={};
    if(preserveValues){
      for(const k in jointMap){ prevValues[k]={ val:jointMap[k].value, init:jointMap[k].initialQuaternion?jointMap[k].initialQuaternion.clone():jointMap[k].node.quaternion.clone() }; }
    }
    jointMap={};
    jointControls.innerHTML='';
    if(!urdfData||!Array.isArray(urdfData.joints)) return;
    urdfData.joints.forEach(j=>{
      const requestedNodeName=j.modelNodeName||j.name;
      const candidates=[];
      currentModel.traverse(candidate=>{
        if(!candidate.name) return;
        const exact=candidate.name===requestedNodeName;
        const numbered=candidate.name.startsWith(requestedNodeName+'.') &&
          /^\.\d+$/.test(candidate.name.slice(requestedNodeName.length));
        // GLTFLoader 会把 Blender 名称 joint6.001 清洗为 joint6001。
        const sanitizedNumbered=candidate.name.startsWith(requestedNodeName) &&
          /^\d{3}$/.test(candidate.name.slice(requestedNodeName.length));
        if(exact||numbered||sanitizedNumbered) candidates.push(candidate);
      });
      candidates.sort((a,b)=>{
        const aExact=a.name===requestedNodeName?0:1;
        const bExact=b.name===requestedNodeName?0:1;
        const aTransform=!a.isMesh&&a.children.length?0:1;
        const bTransform=!b.isMesh&&b.children.length?0:1;
        return aTransform-bTransform || aExact-bExact || a.name.localeCompare(b.name);
      });
      const node=candidates[0];
      if(!node){ return; }
      // 预填父子级（若无则基于骨骼层级推断）兼容 parentLinkName/childLinkName
      if(!j.parentLinkName || !j.childLinkName){
        const parentName=node.parent && node.parent.type!=='Scene' ? node.parent.name : '';
        let childName='';
        for(let c of node.children){ if(c.isBone||c.type==='Bone'){ childName=c.name; break; } }
        j.parentLinkName = j.parentLinkName || j.parent || parentName;
        j.childLinkName = j.childLinkName || j.child || childName;
      }
      const val=(preserveValues&&prevValues[j.name])?prevValues[j.name].val:0;
      const initQ=(preserveValues&&prevValues[j.name])?prevValues[j.name].init.clone():node.quaternion.clone();
      const reportedJointName=j.reportedJointName||j.name;
      jointMap[j.name]={
        node:node,
        modelNodeName:node.name,
        axis:j.axis||{x:0,y:1,z:0},
        value:val,
        reportedJointName,
        positionScale:Number.isFinite(Number(j.positionScale))?Number(j.positionScale):1,
        positionOffsetDeg:Number.isFinite(Number(j.positionOffsetDeg))?Number(j.positionOffsetDeg):0,
        rotationReference:j.rotationReference==='relative'?'relative':'absolute',
        // PILOT_CCS 的上报姿态与改进 DH 结果吻合：固定坐标变换 × 关节旋转。
        // 未配置时使用骨骼局部轴；只有明确按父坐标轴定义时才指定 parent。
        rotationSpace:j.rotationSpace==='parent'?'parent':'local',
        parentLinkName:j.parentLinkName||j.parent||'',
        childLinkName:j.childLinkName||j.child||'',
        originalMaterials:null,
        initialQuaternion:initQ,
        axisHelper:null,
        controlDiv:null,
        slider:null,
        input:null,
        updateSliderTrack:null
      };
      applyJointRotation(j.name,val);

      const div=document.createElement('div'); div.className='joint-control';
      const label=document.createElement('div');
      label.textContent=j.name;
      label.style.width='100px';
      const slider=document.createElement('input'); slider.type='range'; slider.min=-360; slider.max=360; slider.step=1; slider.value=val; slider.style.flex='1';
      function updateSliderTrack(){
        const min=-360, max=360; const value=Number(slider.value)||0;
        const percent=(value-min)/(max-min); // 0..1
        const mid=(0-min)/(max-min); // 0.5
        const start=Math.min(percent, mid);
        const end=Math.max(percent, mid);
        // Build gradient with three zones: left gray, active dark (#333), right gray
        const grad=`linear-gradient(90deg, 
          #F4F4F8 0%, 
          #F4F4F8 ${start*100}%, 
          #333 ${start*100}%, 
          #333 ${end*100}%, 
          #F4F4F8 ${end*100}%, 
          #F4F4F8 100%)`;
        slider.style.background=grad;
      }
      updateSliderTrack();
      const input=document.createElement('input'); input.type='number'; input.step=1; input.className='angle-input'; input.value=val;

      slider.addEventListener('input',()=>{ const v=parseFloat(slider.value); jointMap[j.name].value=v; input.value=v; applyJointRotation(j.name,v); updateSliderTrack(); });
      input.addEventListener('change',()=>{ let v=parseFloat(input.value); if(isNaN(v)) v=0; v=Math.max(-360,Math.min(360,v)); input.value=v; slider.value=v; jointMap[j.name].value=v; applyJointRotation(j.name,v); updateSliderTrack(); });
      
      // Prevent click event from bubbling when clicking on input or slider
      input.addEventListener('click',(e)=>{ e.stopPropagation(); });
      slider.addEventListener('click',(e)=>{ e.stopPropagation(); });

      div.appendChild(label); div.appendChild(slider); div.appendChild(input);
      jointControls.appendChild(div);
      jointMap[j.name].controlDiv=div;
      jointMap[j.name].slider=slider;
      jointMap[j.name].input=input;
      jointMap[j.name].updateSliderTrack=updateSliderTrack;

      div.addEventListener('click',()=>{ highlightJoint(j.name); });
    });
  }

  function applyLatestJointStates(joints){
    const statesByName=new Map();
    const targetSide=joints.find(state=>state.armSide)?.armSide||'';
    const otherSide=targetSide==='left'?'right':targetSide==='right'?'left':'';
    for(const state of joints){
      statesByName.set(state.name,state);
      if(state.armSide){
        statesByName.set(`${state.name}_${state.armSide}`,state);
        statesByName.set(`${state.armSide}_${state.name}`,state);
      }
    }
    const matchedStates=new Set();
    const missingConfigured=[];
    const details=[];
    let applied=0;
    for(const modelJointName in jointMap){
      const joint=jointMap[modelJointName];
      const sideNames=`${modelJointName} ${joint.reportedJointName}`;
      if(otherSide && (
        sideNames.includes(`_${otherSide}`) ||
        sideNames.includes(`${otherSide}_`)
      )){
        continue;
      }
      const state=statesByName.get(joint.reportedJointName);
      if(!state){
        missingConfigured.push(joint.reportedJointName);
        details.push({
          reportedName:joint.reportedJointName,
          modelName:modelJointName,
          matched:false
        });
        continue;
      }
      matchedStates.add(state);
      const reportedDegrees=THREE.MathUtils.radToDeg(state.position);
      const degrees=reportedDegrees*joint.positionScale+joint.positionOffsetDeg;
      joint.value=degrees;
      applyJointRotation(modelJointName,degrees);
      if(joint.slider) joint.slider.value=Math.max(-360,Math.min(360,degrees));
      if(joint.input) joint.input.value=Number(degrees.toFixed(3));
      if(joint.updateSliderTrack) joint.updateSliderTrack();
      details.push({
        reportedName:joint.reportedJointName,
        modelName:modelJointName,
        reportedDegrees,
        mappedDegrees:degrees,
        matched:true
      });
      applied++;
    }
    const unmappedReported=joints
      .filter(state=>!matchedStates.has(state))
      .map(state=>state.name);
    for(const state of joints){
      if(matchedStates.has(state)) continue;
      details.push({
        reportedName:state.name,
        modelName:'未配置',
        reportedDegrees:THREE.MathUtils.radToDeg(state.position),
        matched:false
      });
    }
    return {received:joints.length,applied,missingConfigured,unmappedReported,details};
  }

  function renderJointMappingResult(mapping){
    const notes=[];
    if(mapping.unmappedReported.length) notes.push(`未映射：${mapping.unmappedReported.join(', ')}`);
    if(mapping.missingConfigured.length) notes.push(`未收到：${mapping.missingConfigured.join(', ')}`);
    grpcResult.textContent=`收到 ${mapping.received} 个关节，已应用 ${mapping.applied} 个。${notes.join('；')}`;
  }

  function parseLooseJson(text){
    const trimmed=text.trim();
    if(!trimmed) throw new Error('请先粘贴关节数据');
    try{
      return JSON.parse(trimmed);
    }catch(originalError){
      let candidate=trimmed;
      if(/^"[^"]+"\s*:/.test(candidate)) candidate='{'+candidate;
      const stack=[];
      let inString=false;
      let escaped=false;
      for(const char of candidate){
        if(inString){
          if(escaped) escaped=false;
          else if(char==='\\') escaped=true;
          else if(char==='"') inString=false;
          continue;
        }
        if(char==='"'){ inString=true; continue; }
        if(char==='{' || char==='[') stack.push(char);
        else if(char==='}' || char===']'){
          const expected=char==='}'?'{':'[';
          if(stack.pop()!==expected) throw originalError;
        }
      }
      while(stack.length){
        candidate+=stack.pop()==='{'?'}':']';
      }
      candidate=candidate.replace(/,\s*([}\]])/g,'$1');
      return JSON.parse(candidate);
    }
  }

  function splitJsonDocuments(text){
    const documents=[];
    let start=-1;
    let depth=0;
    let inString=false;
    let escaped=false;
    for(let index=0;index<text.length;index++){
      const char=text[index];
      if(inString){
        if(escaped) escaped=false;
        else if(char==='\\') escaped=true;
        else if(char==='"') inString=false;
        continue;
      }
      if(char==='"'){ inString=true; continue; }
      if(char==='{' || char==='['){
        if(depth===0) start=index;
        depth++;
      }else if(char==='}' || char===']'){
        depth--;
        if(depth===0 && start>=0){
          documents.push(text.slice(start,index+1));
          start=-1;
        }
      }
    }
    return documents;
  }

  function parsePastedJointStates(text,armIndex){
    const documents=splitJsonDocuments(text);
    const selectedText=documents.length>1
      ?documents[armIndex]
      :text;
    if(documents.length>1 && !selectedText){
      throw new Error(`粘贴内容只有 ${documents.length} 段，找不到机械臂编号 ${armIndex} 对应的数据`);
    }
    const payload=parseLooseJson(selectedText);
    let armSide=armIndex===0?'left':armIndex===1?'right':'';
    let joints=Array.isArray(payload)
      ?payload
      :(payload.joints||payload.data?.joints||payload.message?.joints);
    if(!Array.isArray(joints) && payload.arms && typeof payload.arms==='object'){
      const arms=Object.entries(payload.arms)
        .filter(([,arm])=>arm && Array.isArray(arm.joints));
      const selected=arms.find(([,arm])=>Number(arm.index)===armIndex)||arms[0];
      if(selected){
        armSide=selected[0];
        joints=selected[1].joints;
      }
    }
    if(!Array.isArray(joints)) throw new Error('JSON 中没有找到 joints 数组');
    return joints.map((state,index)=>{
      const name=String(state.name||'').trim();
      const position=Number(state.position);
      if(!name || !Number.isFinite(position)){
        throw new Error(`第 ${index+1} 个关节缺少有效的 name 或 position`);
      }
      return {
        name,
        position,
        armSide,
        velocity:Number.isFinite(Number(state.velocity))?Number(state.velocity):undefined,
        effort:Number.isFinite(Number(state.effort))?Number(state.effort):undefined
      };
    });
  }

  getLatestJointsBtn.addEventListener('click',async()=>{
    const armIndex=Number(armIndexInput.value);
    getLatestJointsBtn.disabled=true;
    grpcResult.textContent='正在获取...';
    try{
      const isGrpcUi=/\/grpcui\/?$/i.test(grpcBaseUrl.value.trim());
      if(isGrpcUi && location.protocol==='file:'){
        throw new Error('请运行 node server.mjs，并通过 http://127.0.0.1:8000 打开页面');
      }
      const joints=isGrpcUi
        ?await window.grpcArmJoints.getLatestArmJointStatesViaLocalProxy(grpcBaseUrl.value,armIndex)
        :await window.grpcArmJoints.getLatestArmJointStates(grpcBaseUrl.value,armIndex);
      const armSide=armIndex===0?'left':armIndex===1?'right':'';
      for(const state of joints) state.armSide=armSide;
      latestReportedJointStates=joints;
      const mapping=applyLatestJointStates(joints);
      renderJointMappingResult(mapping);
      setStatus('机械臂关节数据已更新');
    }catch(error){
      grpcResult.textContent='获取失败：'+error.message;
      setStatus('机械臂关节数据获取失败');
    }finally{
      getLatestJointsBtn.disabled=false;
    }
  });

  applyJointStatesBtn.addEventListener('click',()=>{
    try{
      const armIndex=Number(armIndexInput.value);
      const joints=parsePastedJointStates(jointStatesInput.value,armIndex);
      latestReportedJointStates=joints;
      renderJointMappingResult(applyLatestJointStates(joints));
      setStatus('粘贴的机械臂关节数据已应用');
    }catch(error){
      grpcResult.textContent='粘贴数据错误：'+error.message;
      setStatus('关节数据应用失败');
    }
  });

  // 当 JSON 为空时，点击模型关节生成关节 JSON
  function generateJointsFromModel(){
    if(!currentModel) return [];
    const joints=[];
    currentModel.traverse(child=>{
      if(child.isBone || child.type==='Bone'){
        const parentName=child.parent && child.parent.type!=='Scene' ? child.parent.name : '';
        let childName='';
        for(let c of child.children){ if(c.isBone||c.type==='Bone'){ childName=c.name; break; } }
        joints.push({
          name:child.name,
          reportedJointName:child.name,
          positionScale:1,
          positionOffsetDeg:0,
          rotationReference:'absolute',
          rotationSpace:'local',
          axis:{x:0,y:1,z:0},
          parentLinkName:parentName,
          childLinkName:childName
        });
      }
    });
    return joints;
  }

  function extractAxisTwist(quaternion,axis){
    const projected=quaternion.x*axis.x+quaternion.y*axis.y+quaternion.z*axis.z;
    const twist=new THREE.Quaternion(
      axis.x*projected,
      axis.y*projected,
      axis.z*projected,
      quaternion.w
    );
    const lengthSq=twist.x*twist.x+twist.y*twist.y+twist.z*twist.z+twist.w*twist.w;
    if(lengthSq<1e-12) return new THREE.Quaternion();
    return twist.normalize();
  }

  function getAxisTwistDegrees(joint){
    if(!joint||!joint.initialQuaternion) return 0;
    const axis=new THREE.Vector3(joint.axis.x||0,joint.axis.y||0,joint.axis.z||0).normalize();
    if(axis.lengthSq()===0) return 0;
    const twist=extractAxisTwist(joint.initialQuaternion,axis);
    const signedSinHalf=twist.x*axis.x+twist.y*axis.y+twist.z*axis.z;
    let degrees=THREE.MathUtils.radToDeg(2*Math.atan2(signedSinHalf,twist.w));
    degrees=((degrees+180)%360+360)%360-180;
    return degrees;
  }

  function applyJointRotation(name,deg){
    const j=jointMap[name]; if(!j) return;
    const ax=new THREE.Vector3(j.axis.x||0,j.axis.y||0,j.axis.z||0).normalize();
    if(ax.lengthSq()===0) return;
    if(!j.initialQuaternion) j.initialQuaternion=j.node.quaternion.clone();
    const jointQ=new THREE.Quaternion().setFromAxisAngle(ax,THREE.MathUtils.degToRad(deg));
    if(j.rotationReference==='absolute'){
      // GLB 的绑定姿态可能已在关节轴上带有 ±90°/180°。
      // 上报 position 是绝对关节角：只移除绑定四元数在该轴上的 twist，
      // 保留其余 swing 作为 GLB 坐标系固定对齐，因而无需按型号写死偏移。
      const bindTwist=extractAxisTwist(j.initialQuaternion,ax);
      if(j.rotationSpace==='parent'){
        const fixedSwing=bindTwist.clone().invert().multiply(j.initialQuaternion);
        j.node.quaternion.copy(jointQ).multiply(fixedSwing);
      }else{
        const fixedSwing=j.initialQuaternion.clone().multiply(bindTwist.clone().invert());
        j.node.quaternion.copy(fixedSwing).multiply(jointQ);
      }
      return;
    }
    if(j.rotationSpace==='parent'){
      j.node.quaternion.copy(jointQ).multiply(j.initialQuaternion);
    }else{
      j.node.quaternion.copy(j.initialQuaternion).multiply(jointQ);
    }
  }

  let selfCheckActive=false;
  selfCheckBtn.addEventListener('click',()=>{
    selfCheckActive=!selfCheckActive;
    setSelfCheckLabel(selfCheckActive?'停止自检':'开始自检');
  });

  function traverseMeshes(root, fn){ root.traverse(n=>{ if(n.isMesh){ fn(n); } }); }
  function makeAxisGizmo(length, thickness){
    const group=new THREE.Group();
    const createAxis=(color, dir)=>{
      const mat=new THREE.MeshBasicMaterial({color:color});
      const shaftGeom=new THREE.CylinderGeometry(thickness, thickness, length*0.8, 8);
      const shaft=new THREE.Mesh(shaftGeom, mat);
      const coneGeom=new THREE.ConeGeometry(thickness*3, length*0.2, 12);
      const tip=new THREE.Mesh(coneGeom, mat);
      // Orientation
      shaft.rotation.z = dir==='x'?Math.PI/2:0;
      shaft.rotation.x = dir==='z'?Math.PI/2:0;
      tip.rotation.z = dir==='x'?Math.PI/2:0;
      tip.rotation.x = dir==='z'?Math.PI/2:0;
      // Position along axis
      shaft.position[dir]=(length*0.8)/2;
      tip.position[dir]=length*0.9;
      const axisGroup=new THREE.Group();
      axisGroup.add(shaft);
      axisGroup.add(tip);
      return axisGroup;
    };
    const x=createAxis(0xff5555,'x');
    const y=createAxis(0x55ff55,'y');
    const z=createAxis(0x5582ff,'z');
    group.add(x,y,z);
    return group;
  }
  function highlightJoint(name){
  if(highlightedJoint) unhighlight(highlightedJoint);
  const j=jointMap[name]; if(!j) return;
  // 左侧滑轨列表高亮对应项
  jointControls.querySelectorAll('.joint-control').forEach(d=>d.classList.remove('selected'));
  if(j.controlDiv){ j.controlDiv.classList.add('selected'); try{ j.controlDiv.scrollIntoView({behavior:'smooth', block:'nearest'}); }catch(e){} }
  if(!j.originalMaterials){
    j.originalMaterials=new Map();
    traverseMeshes(j.node, mesh=>{ j.originalMaterials.set(mesh.uuid, mesh.material); });
  }
  traverseMeshes(j.node, mesh=>{
    mesh.material=mesh.material.clone();
    if(mesh.material.color) mesh.material.color.set(0x5582FF);
  });
  if(j.axisHelper){ j.node.remove(j.axisHelper); }
  const gizmo=makeAxisGizmo(gizmoLength, gizmoThickness);
  j.node.add(gizmo);
  j.axisHelper=gizmo;
  highlightedJoint=name;
  toggleJointEditor(true,name);
  // 新增：定位并高亮 JSON 中对应关节
  focusJointInJson(name);
}

  function unhighlight(name){
  const j=jointMap[name]; if(!j) return;
  if(j.originalMaterials){ traverseMeshes(j.node, mesh=>{ const m=j.originalMaterials.get(mesh.uuid); if(m) mesh.material=m; }); }
  if(j.axisHelper){ j.node.remove(j.axisHelper); j.axisHelper=null; }
  toggleJointEditor(false);
}

  const raycaster=new THREE.Raycaster();
  const mouse=new THREE.Vector2();
  renderer.domElement.addEventListener('click',event=>{
    if(!currentModel) return;
    const rect=renderer.domElement.getBoundingClientRect();
    mouse.x=((event.clientX-rect.left)/rect.width)*2-1;
    mouse.y=-((event.clientY-rect.top)/rect.height)*2+1;
    raycaster.setFromCamera(mouse,camera);
    const intersects=raycaster.intersectObjects(currentModel.children,true);
    if(intersects.length>0){
      let obj=intersects[0].object;
      while(obj && !jointMap[obj.name]){ obj=obj.parent; }
      if(obj && jointMap[obj.name]){ highlightJoint(obj.name); }
      else {
        let shouldGenerate=false;
        const raw=jsonInput.value.trim();
        if(raw==='') { shouldGenerate=true; }
        else {
          try{
            const data=JSON.parse(raw);
            const u=data.urdf&&Array.isArray(data.urdf.joints)?data.urdf:data;
            if(!u || !Array.isArray(u.joints) || u.joints.length===0) shouldGenerate=true;
          }catch(e){ shouldGenerate=true; }
        }
        if(shouldGenerate){
          const autoJoints=generateJointsFromModel();
          urdfData={joints:autoJoints};
          jsonInput.value=JSON.stringify({urdf:{joints:autoJoints}},null,2);
          setupJointsFromURDF(false);
          setStatus('已从模型骨骼生成关节 JSON');
        }
      }
    }else{
      if(highlightedJoint){ unhighlight(highlightedJoint); highlightedJoint=null; }
    }
  });

  copyBtn.addEventListener('click', ()=>{
    try {
      const editedJSON = jsonInput.value;
      JSON.parse(editedJSON);
      navigator.clipboard.writeText(editedJSON).then(()=>{
        setStatus('JSON 已复制到剪贴板！');
      }).catch(err=>{
        setStatus('复制失败: '+err);
      });
    } catch(e){
      setStatus('JSON 格式错误: '+e.message);
    }
  });

  document.querySelectorAll('.view-buttons button').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(btn.dataset.view==='map'){
        if(!mapPlane || !currentMap) return;
        const size=getMapSize(currentMap);
        const maxDim=Math.max(size.width,size.height,1);
        const fov=camera.fov * (Math.PI/180);
        const distance=maxDim / (2*Math.tan(fov/2)) * 1.2;
        const center=new THREE.Vector3(currentMap.center.x,currentMap.center.y,mapPlane.position.z);
        camera.position.set(center.x,center.y,center.z+distance);
        camera.lookAt(center);
        controls.target.copy(center);
        controls.update();
        return;
      }
      if(!currentModel) return;
      const box=new THREE.Box3().setFromObject(currentModel);
      const size=box.getSize(new THREE.Vector3());
      const center=box.getCenter(new THREE.Vector3());
      const maxDim=Math.max(size.x,size.y,size.z);
      const fov=camera.fov * (Math.PI/180);
      const distance=maxDim / (2*Math.tan(fov/2)) * 1.2;
      switch(btn.dataset.view){
        case 'top': camera.position.set(center.x, center.y, center.z+distance); break;
        case 'bottom': camera.position.set(center.x, center.y, center.z-distance); break;
        case 'front': camera.position.set(center.x, center.y+distance, center.z); break;
        case 'back': camera.position.set(center.x, center.y-distance, center.z); break;
        case 'left': camera.position.set(center.x-distance, center.y, center.z); break;
        case 'right': camera.position.set(center.x+distance, center.y, center.z); break;
      }
      camera.lookAt(center);
      controls.target.copy(center);
      controls.update();
    });
  });

  loadScenarioFromQuery().catch(error=>{
    console.error('测试场景加载失败',error);
    setStatus(error.message);
  });

  function animate(){
    requestAnimationFrame(animate);
    controls.update();
    if(selfCheckActive){
      const t=Date.now()*0.001;
      for(const k in jointMap){ const j=jointMap[k]; const val=Math.sin(t)*360; applyJointRotation(k,val); }
    }
    renderer.render(scene,camera);
  }
  animate();
});
})();
